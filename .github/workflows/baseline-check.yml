name: Baseline Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend tests and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and package backend
        run: mvn -B package
        working-directory: backend
      - name: Verify running API
        shell: bash
        run: |
          java -jar backend/target/power-alarm-backend-0.1.0.jar > /tmp/power-alarm.log 2>&1 &
          trap 'cat /tmp/power-alarm.log' ERR
          node scripts/baseline-http-smoke.mjs
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend
      - name: Verify frontend HTTP startup
        shell: bash
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/power-alarm-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /tmp/power-alarm-index.html; then break; fi
            sleep 1
          done
          grep -q '<div id="app">' /tmp/power-alarm-index.html
