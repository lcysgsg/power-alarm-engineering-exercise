spring:
  application:
    name: power-alarm
  datasource:
    url: jdbc:h2:mem:power_alarm;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
